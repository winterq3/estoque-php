<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios · Almoxarifado</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#14181F', surface: '#1E2530', line: '#2E3644',
          ink: '#E8EAED', muted: '#8B93A1', amber: '#E8A33D',
          ok: '#4F9D69', crit: '#D64545',
        },
        fontFamily: {
          display: ['Oswald', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  body { background-color: #14181F; }
  .nav-link { color: #8B93A1; transition: color .15s; }
  .nav-link:hover, .nav-link.active { color: #E8EAED; }
  .nav-link.active { border-bottom: 2px solid #E8A33D; }
  ::selection { background: #E8A33D; color: #14181F; }
  input, select { background: #1E2530; border: 1px solid #2E3644; color: #E8EAED; }
  input:focus, select:focus { outline: none; border-color: #E8A33D; }
  .btn-primary { background: #E8A33D; color: #14181F; }
  .btn-primary:hover { background: #f0b158; }
  .btn-ghost { border: 1px solid #2E3644; color: #8B93A1; }
  .btn-ghost:hover { color: #E8EAED; border-color: #8B93A1; }
  .tag-card { position: relative; border: 1px dashed #2E3644; background: #1E2530; }
</style>
</head>
<body class="font-body text-ink min-h-screen">
  <script src="auth.js"></script>

  <header class="border-b border-line">
    <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 border-2 border-amber flex items-center justify-center font-mono text-amber text-xs font-semibold">#A</div>
        <h1 class="font-display text-lg tracking-wide uppercase">Almoxarifado</h1>
      </div>
      <nav class="hidden sm:flex gap-6 text-sm font-medium pb-1">
        <a href="dashboard.html" class="nav-link pb-1">Dashboard</a>
        <a href="produtos.html" class="nav-link pb-1">Produtos</a>
        <a href="movimentacoes.html" class="nav-link pb-1">Movimentações</a>
        <a href="fornecedores.html" class="nav-link pb-1">Fornecedores</a>
        <a href="relatorios.html" class="nav-link active pb-1">Relatórios</a>
      </nav>
      <div class="flex items-center gap-4">
        <span id="usuario-logado" class="text-xs font-mono text-muted hidden sm:inline"></span>
        <button onclick="fazerLogout()" class="btn-ghost text-xs font-mono px-3 py-1.5 rounded-sm">Sair</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10">
    <div class="mb-8">
      <p class="text-xs font-mono text-muted uppercase tracking-widest mb-1">Análise</p>
      <h2 class="font-display text-3xl uppercase tracking-wide">Relatórios</h2>
    </div>

    <!-- Filtros -->
    <div class="border border-line p-5 mb-8 grid grid-cols-1 sm:grid-cols-5 gap-4 items-end">
      <div>
        <label class="text-xs font-mono text-muted uppercase tracking-widest">De</label>
        <input type="date" id="filtro-inicio" class="w-full mt-1 px-3 py-2 text-sm rounded-sm">
      </div>
      <div>
        <label class="text-xs font-mono text-muted uppercase tracking-widest">Até</label>
        <input type="date" id="filtro-fim" class="w-full mt-1 px-3 py-2 text-sm rounded-sm">
      </div>
      <div>
        <label class="text-xs font-mono text-muted uppercase tracking-widest">Categoria</label>
        <select id="filtro-categoria" class="w-full mt-1 px-3 py-2 text-sm rounded-sm">
          <option value="">Todas</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-mono text-muted uppercase tracking-widest">Tipo</label>
        <select id="filtro-tipo" class="w-full mt-1 px-3 py-2 text-sm rounded-sm">
          <option value="">Entradas e saídas</option>
          <option value="entrada">Só entradas</option>
          <option value="saida">Só saídas</option>
        </select>
      </div>
      <button onclick="aplicarFiltros()" class="btn-primary text-sm font-medium py-2.5 rounded-sm">Filtrar</button>
    </div>

    <!-- Resumo -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-10">
      <div class="tag-card px-5 py-4">
        <p class="text-xs font-mono text-muted uppercase tracking-widest mb-2">Total de entradas</p>
        <p class="font-mono text-3xl font-semibold text-ok" id="resumo-entradas">—</p>
      </div>
      <div class="tag-card px-5 py-4">
        <p class="text-xs font-mono text-muted uppercase tracking-widest mb-2">Total de saídas</p>
        <p class="font-mono text-3xl font-semibold text-crit" id="resumo-saidas">—</p>
      </div>
      <div class="tag-card px-5 py-4">
        <p class="text-xs font-mono text-muted uppercase tracking-widest mb-2">Lançamentos no período</p>
        <p class="font-mono text-3xl font-semibold" id="resumo-total">—</p>
      </div>
    </section>

    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 bg-muted rounded-full"></span>
        <h3 class="font-display text-sm uppercase tracking-widest text-muted">Detalhamento</h3>
      </div>
      <button onclick="exportarCsv()" class="btn-ghost text-xs font-mono px-4 py-2 rounded-sm">
        ⭳ Exportar CSV
      </button>
    </div>

    <div class="border border-line overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-line text-left text-xs font-mono text-muted uppercase tracking-widest">
            <th class="px-5 py-3 font-medium">Data</th>
            <th class="px-5 py-3 font-medium">Produto</th>
            <th class="px-5 py-3 font-medium">Categoria</th>
            <th class="px-5 py-3 font-medium">Responsável</th>
            <th class="px-5 py-3 font-medium text-right">Quantidade</th>
          </tr>
        </thead>
        <tbody id="tabela-relatorio" class="divide-y divide-line">
          <tr><td colspan="5" class="px-5 py-6 text-center text-muted font-mono text-sm">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    function montarQueryString() {
      const params = new URLSearchParams();
      const inicio = document.getElementById('filtro-inicio').value;
      const fim = document.getElementById('filtro-fim').value;
      const categoria = document.getElementById('filtro-categoria').value;
      const tipo = document.getElementById('filtro-tipo').value;

      if (inicio) params.set('inicio', inicio);
      if (fim) params.set('fim', fim);
      if (categoria) params.set('categoria', categoria);
      if (tipo) params.set('tipo', tipo);

      return params.toString();
    }

    async function carregarCategorias() {
      const res = await fetch('produtos');
      const produtos = await res.json();
      const categorias = [...new Set(produtos.map(p => p.categoria).filter(Boolean))];

      const select = document.getElementById('filtro-categoria');
      categorias.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
    }

    async function aplicarFiltros() {
      const qs = montarQueryString();
      const res = await fetch(`relatorios/movimentacoes${qs ? '?' + qs : ''}`);
      const dados = await res.json();

      document.getElementById('resumo-entradas').textContent = dados.total_entradas;
      document.getElementById('resumo-saidas').textContent = dados.total_saidas;
      document.getElementById('resumo-total').textContent = dados.quantidade_itens;

      renderTabela(dados.movimentacoes);
    }

    function renderTabela(itens) {
      const tbody = document.getElementById('tabela-relatorio');
      if (!itens.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-5 py-6 text-center text-muted font-mono text-sm">Nenhuma movimentação encontrada para esse filtro.</td></tr>`;
        return;
      }
      tbody.innerHTML = itens.map(m => {
        const cor = m.tipo === 'entrada' ? 'text-ok' : 'text-crit';
        const sinal = m.tipo === 'entrada' ? '+' : '−';
        const data = new Date(m.data_movimentacao).toLocaleDateString('pt-BR');
        return `
          <tr>
            <td class="px-5 py-3.5 font-mono text-xs text-muted">${data}</td>
            <td class="px-5 py-3.5 font-medium">${m.produto_nome}</td>
            <td class="px-5 py-3.5 text-muted text-xs uppercase font-mono">${m.produto_categoria ?? '—'}</td>
            <td class="px-5 py-3.5 text-muted text-xs">${m.responsavel ?? '—'}</td>
            <td class="px-5 py-3.5 text-right font-mono font-semibold ${cor}">${sinal} ${m.quantidade}</td>
          </tr>
        `;
      }).join('');
    }

    function exportarCsv() {
      const qs = montarQueryString();
      window.location.href = `relatorios/exportar-csv${qs ? '?' + qs : ''}`;
    }

    carregarCategorias();
    aplicarFiltros();
  </script>
</body>
</html>
