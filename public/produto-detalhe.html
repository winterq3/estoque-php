<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhe do Produto · Almoxarifado</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#14181F', surface: '#1E2530', line: '#2E3644',
          ink: '#E8EAED', muted: '#8B93A1', amber: '#E8A33D',
          ok: '#4F9D69', crit: '#D64545',
        },
        fontFamily: {
          display: ['Oswald', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  body { background-color: #14181F; }
  .nav-link { color: #8B93A1; transition: color .15s; }
  .nav-link:hover, .nav-link.active { color: #E8EAED; }
  .nav-link.active { border-bottom: 2px solid #E8A33D; }
  ::selection { background: #E8A33D; color: #14181F; }
  .btn-ghost { border: 1px solid #2E3644; color: #8B93A1; }
  .btn-ghost:hover { color: #E8EAED; border-color: #8B93A1; }
  .tag-card { position: relative; border: 1px dashed #2E3644; background: #1E2530; }
</style>
</head>
<body class="font-body text-ink min-h-screen">
  <script src="auth.js"></script>

  <header class="border-b border-line">
    <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 border-2 border-amber flex items-center justify-center font-mono text-amber text-xs font-semibold">#A</div>
        <h1 class="font-display text-lg tracking-wide uppercase">Almoxarifado</h1>
      </div>
      <nav class="hidden sm:flex gap-6 text-sm font-medium pb-1">
        <a href="dashboard.html" class="nav-link pb-1">Dashboard</a>
        <a href="produtos.html" class="nav-link active pb-1">Produtos</a>
        <a href="movimentacoes.html" class="nav-link pb-1">Movimentações</a>
        <a href="fornecedores.html" class="nav-link pb-1">Fornecedores</a>
        <a href="relatorios.html" class="nav-link pb-1">Relatórios</a>
      </nav>
      <div class="flex items-center gap-4">
        <span id="usuario-logado" class="text-xs font-mono text-muted hidden sm:inline"></span>
        <button onclick="fazerLogout()" class="btn-ghost text-xs font-mono px-3 py-1.5 rounded-sm">Sair</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10">
    <a href="produtos.html" class="text-xs font-mono text-muted hover:text-ink">&larr; voltar para produtos</a>

    <div class="flex flex-wrap items-start justify-between gap-4 mt-4 mb-8">
      <div>
        <p class="text-xs font-mono text-muted uppercase tracking-widest mb-1" id="produto-categoria">—</p>
        <h2 class="font-display text-3xl uppercase tracking-wide" id="produto-nome">Carregando...</h2>
        <p class="text-xs text-muted mt-1" id="produto-fornecedor"></p>
      </div>
    </div>

    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-10">
      <div class="tag-card px-5 py-4">
        <p class="text-xs font-mono text-muted uppercase tracking-widest mb-2">Saldo atual</p>
        <p class="font-mono text-3xl font-semibold" id="produto-saldo">—</p>
      </div>
      <div class="tag-card px-5 py-4">
        <p class="text-xs font-mono text-muted uppercase tracking-widest mb-2">Mínimo</p>
        <p class="font-mono text-3xl font-semibold text-muted" id="produto-minimo">—</p>
      </div>
      <div class="tag-card px-5 py-4">
        <p class="text-xs font-mono text-muted uppercase tracking-widest mb-2">Total de lançamentos</p>
        <p class="font-mono text-3xl font-semibold" id="produto-total-mov">—</p>
      </div>
    </section>

    <div class="flex items-center gap-2 mb-3">
      <span class="w-2 h-2 bg-muted rounded-full"></span>
      <h3 class="font-display text-sm uppercase tracking-widest text-muted">Histórico completo</h3>
    </div>
    <div class="border border-line divide-y divide-line" id="lista-historico">
      <p class="px-5 py-4 text-sm text-muted font-mono">Carregando...</p>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const produtoId = params.get('id');

    if (!produtoId) {
      window.location.href = 'produtos.html';
    }

    async function carregarDetalhe() {
      const [produtoRes, historicoRes] = await Promise.all([
        fetch(`produtos/${produtoId}`),
        fetch(`movimentacoes/${produtoId}`),
      ]);

      if (!produtoRes.ok) {
        window.location.href = 'produtos.html';
        return;
      }

      const produto = await produtoRes.json();
      const historico = await historicoRes.json();

      renderProduto(produto);
      renderHistorico(historico);
    }

    function renderProduto(p) {
      document.getElementById('produto-nome').textContent = p.nome;
      document.getElementById('produto-categoria').textContent = p.categoria || 'sem categoria';
      document.getElementById('produto-fornecedor').textContent = p.fornecedor_nome
        ? `Fornecedor: ${p.fornecedor_nome}`
        : 'Sem fornecedor vinculado';

      const critico = p.saldo_atual < p.quantidade_minima;
      const saldoEl = document.getElementById('produto-saldo');
      saldoEl.textContent = `${p.saldo_atual} ${p.unidade_medida}`;
      saldoEl.className = `font-mono text-3xl font-semibold ${critico ? 'text-crit' : ''}`;

      document.getElementById('produto-minimo').textContent = `${p.quantidade_minima} ${p.unidade_medida}`;
    }

    function renderHistorico(itens) {
      document.getElementById('produto-total-mov').textContent = itens.length;

      const container = document.getElementById('lista-historico');
      if (!itens.length) {
        container.innerHTML = `<p class="px-5 py-4 text-sm text-muted font-mono">Nenhuma movimentação registrada ainda.</p>`;
        return;
      }
      container.innerHTML = itens.map(m => {
        const cor = m.tipo === 'entrada' ? 'text-ok' : 'text-crit';
        const sinal = m.tipo === 'entrada' ? '+' : '−';
        const data = new Date(m.data_movimentacao).toLocaleString('pt-BR', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        return `
          <div class="px-5 py-4 flex items-center justify-between">
            <div>
              <p class="text-sm font-medium">${data}</p>
              <p class="text-xs text-muted font-mono">${m.responsavel ?? 'sem responsável'}</p>
            </div>
            <div class="flex items-center gap-4">
              <p class="font-mono text-sm font-semibold ${cor}">${sinal} ${m.quantidade}</p>
              <button onclick="excluirMovimentacao(${m.id})" class="text-xs font-mono text-muted hover:text-crit">excluir</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function excluirMovimentacao(id) {
      if (!confirm('Remover esta movimentação? O saldo do produto será recalculado.')) return;
      await fetch(`movimentacoes/${id}`, { method: 'DELETE' });
      carregarDetalhe();
    }

    carregarDetalhe();
  </script>
</body>
</html>
