<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fornecedores · Almoxarifado</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#14181F', surface: '#1E2530', line: '#2E3644',
          ink: '#E8EAED', muted: '#8B93A1', amber: '#E8A33D',
          ok: '#4F9D69', crit: '#D64545',
        },
        fontFamily: {
          display: ['Oswald', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  body { background-color: #14181F; }
  .nav-link { color: #8B93A1; transition: color .15s; }
  .nav-link:hover, .nav-link.active { color: #E8EAED; }
  .nav-link.active { border-bottom: 2px solid #E8A33D; }
  ::selection { background: #E8A33D; color: #14181F; }
  input { background: #1E2530; border: 1px solid #2E3644; color: #E8EAED; }
  input:focus { outline: none; border-color: #E8A33D; }
  .btn-primary { background: #E8A33D; color: #14181F; }
  .btn-primary:hover { background: #f0b158; }
  .btn-ghost { border: 1px solid #2E3644; color: #8B93A1; }
  .btn-ghost:hover { color: #E8EAED; border-color: #8B93A1; }
  .modal-backdrop { background: rgba(20,24,31,0.8); }
</style>
</head>
<body class="font-body text-ink min-h-screen">
  <script src="auth.js"></script>

  <header class="border-b border-line">
    <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 border-2 border-amber flex items-center justify-center font-mono text-amber text-xs font-semibold">#A</div>
        <h1 class="font-display text-lg tracking-wide uppercase">Almoxarifado</h1>
      </div>
      <nav class="hidden sm:flex gap-6 text-sm font-medium pb-1">
        <a href="dashboard.html" class="nav-link pb-1">Dashboard</a>
        <a href="produtos.html" class="nav-link pb-1">Produtos</a>
        <a href="movimentacoes.html" class="nav-link pb-1">Movimentações</a>
        <a href="fornecedores.html" class="nav-link active pb-1">Fornecedores</a>
        <a href="relatorios.html" class="nav-link pb-1">Relatórios</a>
      </nav>
      <div class="flex items-center gap-4">
        <span id="usuario-logado" class="text-xs font-mono text-muted hidden sm:inline"></span>
        <button onclick="fazerLogout()" class="btn-ghost text-xs font-mono px-3 py-1.5 rounded-sm">Sair</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <div>
        <p class="text-xs font-mono text-muted uppercase tracking-widest mb-1">Parceiros</p>
        <h2 class="font-display text-3xl uppercase tracking-wide">Fornecedores</h2>
      </div>
      <button onclick="abrirModal()" class="btn-primary font-medium text-sm px-5 py-2.5 rounded-sm">
        + Cadastrar fornecedor
      </button>
    </div>

    <div class="border border-line overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-line text-left text-xs font-mono text-muted uppercase tracking-widest">
            <th class="px-5 py-3 font-medium">Nome</th>
            <th class="px-5 py-3 font-medium">Telefone</th>
            <th class="px-5 py-3 font-medium">E-mail</th>
            <th class="px-5 py-3 font-medium text-right">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-fornecedores" class="divide-y divide-line">
          <tr><td colspan="4" class="px-5 py-6 text-center text-muted font-mono text-sm">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal de cadastro/edição -->
  <div id="modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center px-4 z-50">
    <div class="bg-surface border border-line w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-5">
        <h3 class="font-display text-lg uppercase tracking-wide" id="modal-titulo">Cadastrar fornecedor</h3>
        <button onclick="fecharModal()" class="text-muted hover:text-ink text-xl leading-none">&times;</button>
      </div>
      <form id="form-fornecedor" class="space-y-4" onsubmit="salvarFornecedor(event)">
        <input type="hidden" id="fornecedor-id">
        <div>
          <label class="text-xs font-mono text-muted uppercase tracking-widest">Nome</label>
          <input type="text" id="fornecedor-nome" required class="w-full mt-1 px-3 py-2 text-sm rounded-sm">
        </div>
        <div>
          <label class="text-xs font-mono text-muted uppercase tracking-widest">Telefone</label>
          <input type="text" id="fornecedor-telefone" class="w-full mt-1 px-3 py-2 text-sm rounded-sm">
        </div>
        <div>
          <label class="text-xs font-mono text-muted uppercase tracking-widest">E-mail</label>
          <input type="email" id="fornecedor-email" class="w-full mt-1 px-3 py-2 text-sm rounded-sm">
        </div>
        <p id="erro-fornecedor" class="text-crit text-xs font-mono hidden"></p>
        <div class="flex gap-3 pt-2">
          <button type="submit" class="btn-primary flex-1 font-medium text-sm py-2.5 rounded-sm">Salvar</button>
          <button type="button" onclick="fecharModal()" class="btn-ghost flex-1 font-medium text-sm py-2.5 rounded-sm">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let fornecedores = [];

    async function carregarFornecedores() {
      const res = await fetch('fornecedores');
      fornecedores = await res.json();
      renderTabela();
    }

    function renderTabela() {
      const tbody = document.getElementById('tabela-fornecedores');
      if (!fornecedores.length) {
        tbody.innerHTML = `<tr><td colspan="4" class="px-5 py-6 text-center text-muted font-mono text-sm">Nenhum fornecedor cadastrado.</td></tr>`;
        return;
      }
      tbody.innerHTML = fornecedores.map(f => `
        <tr class="hover:bg-surface/50">
          <td class="px-5 py-3.5 font-medium">${f.nome}</td>
          <td class="px-5 py-3.5 text-muted font-mono text-xs">${f.telefone ?? '—'}</td>
          <td class="px-5 py-3.5 text-muted text-xs">${f.email ?? '—'}</td>
          <td class="px-5 py-3.5 text-right">
            <button onclick="editarFornecedor(${f.id})" class="text-xs font-mono text-muted hover:text-amber mr-3">editar</button>
            <button onclick="excluirFornecedor(${f.id})" class="text-xs font-mono text-muted hover:text-crit">excluir</button>
          </td>
        </tr>
      `).join('');
    }

    function abrirModal() {
      document.getElementById('modal-titulo').textContent = 'Cadastrar fornecedor';
      document.getElementById('form-fornecedor').reset();
      document.getElementById('fornecedor-id').value = '';
      document.getElementById('erro-fornecedor').classList.add('hidden');
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function fecharModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    function editarFornecedor(id) {
      const f = fornecedores.find(x => x.id === id);
      if (!f) return;
      document.getElementById('modal-titulo').textContent = 'Editar fornecedor';
      document.getElementById('fornecedor-id').value = f.id;
      document.getElementById('fornecedor-nome').value = f.nome;
      document.getElementById('fornecedor-telefone').value = f.telefone ?? '';
      document.getElementById('fornecedor-email').value = f.email ?? '';
      document.getElementById('erro-fornecedor').classList.add('hidden');
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    async function salvarFornecedor(event) {
      event.preventDefault();
      const id = document.getElementById('fornecedor-id').value;
      const dados = {
        nome: document.getElementById('fornecedor-nome').value,
        telefone: document.getElementById('fornecedor-telefone').value || null,
        email: document.getElementById('fornecedor-email').value || null,
      };

      const url = id ? `fornecedores/${id}` : 'fornecedores';
      const method = id ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados),
      });
      const resultado = await res.json();

      if (!res.ok) {
        const erroEl = document.getElementById('erro-fornecedor');
        erroEl.textContent = resultado.erro || 'Erro ao salvar fornecedor';
        erroEl.classList.remove('hidden');
        return;
      }

      fecharModal();
      carregarFornecedores();
    }

    async function excluirFornecedor(id) {
      if (!confirm('Remover este fornecedor?')) return;
      await fetch(`fornecedores/${id}`, { method: 'DELETE' });
      carregarFornecedores();
    }

    carregarFornecedores();
  </script>
</body>
</html>
