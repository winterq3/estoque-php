<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Almoxarifado</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#14181F', surface: '#1E2530', line: '#2E3644',
          ink: '#E8EAED', muted: '#8B93A1', amber: '#E8A33D',
          ok: '#4F9D69', crit: '#D64545',
        },
        fontFamily: {
          display: ['Oswald', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  body { background-color: #14181F; }
  input { background: #1E2530; border: 1px solid #2E3644; color: #E8EAED; }
  input:focus { outline: none; border-color: #E8A33D; }
  .btn-primary { background: #E8A33D; color: #14181F; }
  .btn-primary:hover { background: #f0b158; }
  .tab-btn { color: #8B93A1; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: #E8EAED; border-color: #E8A33D; }
  ::selection { background: #E8A33D; color: #14181F; }
</style>
</head>
<body class="font-body text-ink min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="flex items-center gap-3 justify-center mb-8">
      <div class="w-9 h-9 border-2 border-amber flex items-center justify-center font-mono text-amber text-sm font-semibold">#A</div>
      <h1 class="font-display text-xl tracking-wide uppercase">Almoxarifado</h1>
    </div>

    <div class="border border-line">
      <div class="flex border-b border-line">
        <button id="tab-login" onclick="setAba('login')" class="tab-btn active flex-1 py-3 text-sm font-medium uppercase tracking-wide">Entrar</button>
        <button id="tab-register" onclick="setAba('register')" class="tab-btn flex-1 py-3 text-sm font-medium uppercase tracking-wide">Cadastrar</button>
      </div>

      <!-- Formulário de login -->
      <form id="form-login" onsubmit="fazerLogin(event)" class="p-6 space-y-4">
        <div>
          <label class="text-xs font-mono text-muted uppercase tracking-widest">E-mail</label>
          <input type="email" id="login-email" required class="w-full mt-1 px-3 py-2.5 text-sm rounded-sm">
        </div>
        <div>
          <label class="text-xs font-mono text-muted uppercase tracking-widest">Senha</label>
          <input type="password" id="login-senha" required class="w-full mt-1 px-3 py-2.5 text-sm rounded-sm">
        </div>
        <p id="erro-login" class="text-crit text-xs font-mono hidden"></p>
        <button type="submit" class="btn-primary w-full font-medium text-sm py-2.5 rounded-sm">Entrar</button>
      </form>

      <!-- Formulário de cadastro -->
      <form id="form-register" onsubmit="fazerRegistro(event)" class="p-6 space-y-4 hidden">
        <div>
          <label class="text-xs font-mono text-muted uppercase tracking-widest">Nome</label>
          <input type="text" id="register-nome" required class="w-full mt-1 px-3 py-2.5 text-sm rounded-sm">
        </div>
        <div>
          <label class="text-xs font-mono text-muted uppercase tracking-widest">E-mail</label>
          <input type="email" id="register-email" required class="w-full mt-1 px-3 py-2.5 text-sm rounded-sm">
        </div>
        <div>
          <label class="text-xs font-mono text-muted uppercase tracking-widest">Senha</label>
          <input type="password" id="register-senha" required minlength="6" class="w-full mt-1 px-3 py-2.5 text-sm rounded-sm">
          <p class="text-xs text-muted font-mono mt-1">Mínimo 6 caracteres</p>
        </div>
        <p id="erro-register" class="text-crit text-xs font-mono hidden"></p>
        <button type="submit" class="btn-primary w-full font-medium text-sm py-2.5 rounded-sm">Criar conta</button>
      </form>
    </div>
  </div>

  <script>
    function setAba(aba) {
      document.getElementById('tab-login').classList.toggle('active', aba === 'login');
      document.getElementById('tab-register').classList.toggle('active', aba === 'register');
      document.getElementById('form-login').classList.toggle('hidden', aba !== 'login');
      document.getElementById('form-register').classList.toggle('hidden', aba !== 'register');
    }

    async function fazerLogin(event) {
      event.preventDefault();
      const dados = {
        email: document.getElementById('login-email').value,
        senha: document.getElementById('login-senha').value,
      };

      const res = await fetch('auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados),
      });
      const resultado = await res.json();

      const erroEl = document.getElementById('erro-login');
      if (!res.ok) {
        erroEl.textContent = resultado.erro || 'Erro ao fazer login';
        erroEl.classList.remove('hidden');
        return;
      }

      window.location.href = 'dashboard.html';
    }

    async function fazerRegistro(event) {
      event.preventDefault();
      const dados = {
        nome: document.getElementById('register-nome').value,
        email: document.getElementById('register-email').value,
        senha: document.getElementById('register-senha').value,
      };

      const res = await fetch('auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados),
      });
      const resultado = await res.json();

      const erroEl = document.getElementById('erro-register');
      if (!res.ok) {
        erroEl.textContent = resultado.erro || 'Erro ao cadastrar';
        erroEl.classList.remove('hidden');
        return;
      }

      // Depois de cadastrar, já faz login automaticamente
      const loginRes = await fetch('auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: dados.email, senha: dados.senha }),
      });

      if (loginRes.ok) {
        window.location.href = 'dashboard.html';
      } else {
        setAba('login');
      }
    }
  </script>
</body>
</html>
